name: Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black==23.12.1 flake8==7.0.0 isort==5.13.2 mypy==1.8.0
        pip install types-PyYAML types-requests

    - name: Check code formatting with Black
      run: |
        black --check --diff src/ tests/ scripts/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/ tests/ scripts/

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ scripts/ --count --show-source --statistics

    - name: Type check with mypy
      run: |
        mypy src/ --install-types --non-interactive || true

    - name: Check for trailing whitespace
      run: |
        ! git grep -I --line-number '[[:blank:]]$' -- '*.py' '*.yml' '*.yaml' '*.md' || (echo "Found trailing whitespace" && exit 1)

    - name: Lint summary
      if: always()
      run: |
        echo "### Lint Results :white_check_mark:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All code quality checks completed." >> $GITHUB_STEP_SUMMARY

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]==1.7.6 safety==3.0.1

    - name: Run Bandit security linter
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ || true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements-dev.txt || true
        safety check --json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30
